services:
  - type: web
    name: krishimitra-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt gunicorn && python training/prepare_dataset.py && python training/train_classifier.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 'app:create_app()'"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.0
