{% extends "base.html" %}

{% block title %}Register — KrishiMitra AI{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="km-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h1 style="font-size: 1.8rem; color: var(--primary-dark);">Join KrishiMitra AI</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Smart Farming. Better Decisions. Sustainable Agriculture.</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Language</label>
        <select name="preferred_language" class="form-control">
          <option value="en">English</option>
          <option value="kn">ಕನ್ನಡ (Kannada)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Farm District & State</label>
        <input type="text" name="location" class="form-control" value="Bengaluru, Karnataka" placeholder="e.g. Kolar, Karnataka">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
        Complete Registration ➔
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--primary-forest); font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
